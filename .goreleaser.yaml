version: 2

project_name: mlvm

builds:
  - id: mlvm
    main: ./cmd/mlvm
    binary: mlvm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  # Lower-case GOOS/GOARCH names; install.sh and scripts/homebrew-formula.py rely on them.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - spec/*
      - docs/STATUS.md
      - docs/DECODER-PROTOCOL.md
      - docs/INSTALL.md
      - .github/SECURITY.md
      - models/tinystories-260k.manifest.json

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  prerelease: auto

