[package]
name = "llm-candle"
version = "0.1.0"
edition = "2021"
description = "A Hugging Face Llama-architecture LLM (SmolLM2) generating text through Candle, inside MLVM"

[dependencies]
anyhow = "1"
candle-core = "0.4.1"
candle-nn = "0.4.1"
candle-transformers = "0.4.1"
serde_json = "1.0.99"
tokenizers = { path = "../../../third_party/tokenizers/tokenizers", default-features = false, features = ["unstable_wasm"] }
