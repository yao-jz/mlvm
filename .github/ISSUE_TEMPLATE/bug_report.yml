name: Bug report
description: Report incorrect execution, crashes, proof mismatches, or tooling problems.
title: '[bug] '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not file security vulnerabilities publicly. Use the process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest guest, command, state, or proof that reproduces the issue.
      placeholder: |
        make doctor
        bin/mlvm ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: MLVM revision
      description: Commit SHA or release version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, compiler, and Foundry version when relevant.
    validations:
      required: true
  - type: dropdown
    id: determinism
    attributes:
      label: Does this affect deterministic execution or proof verification?
      options:
        - Unknown
        - 'Yes'
        - 'No'
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or artifacts
      description: Attach concise logs, hashes, witnesses, or disassembly. Remove secrets first.

