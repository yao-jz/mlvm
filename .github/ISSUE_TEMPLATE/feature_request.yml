name: Feature request
description: Propose an ISA, syscall, tooling, integration, or documentation improvement.
title: '[feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete workflow is blocked today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-facing result, not only an implementation idea.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Determinism and proof implications
      description: Which fast, slow, Solidity, state commitment, or syscall components must agree?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

