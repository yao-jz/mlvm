<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 324" width="792" height="324" role="img" aria-labelledby="fig4-t">
<title id="fig4-t">Questions needed to isolate one instruction against instructions executed, on a log scale, for disputes over the gallery's 13 programs. Every point lies on the log2 N line: 18 questions for 263 thousand instructions, 26 for 38 million, 30 for 1.06 billion, 32 for 6.75 billion, 34 for 14.8 billion.</title>
<style>
    svg {
      --surface: #ffffff; --surface-2: #f6f8fa; --ink: #1f2328; --ink-2: #59636e;
      --muted: #8c959f; --grid: #eaeef2; --axis: #d0d7de; --caller: #d0d7de;
      --accent: #3b7dd8; --honest: #3b7dd8; --liar: #c9743a;
      --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #0d1117; --surface-2: #161b22; --ink: #e6edf3; --ink-2: #9198a1;
        --muted: #6e7681; --grid: #21262d; --axis: #30363d; --caller: #30363d;
      }
    }
    .bg { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
    text { font-family: var(--sans); }
    .f-box { fill: var(--surface); stroke: var(--axis); stroke-width: 1.25; }
    .f-box-alt { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1.25; }
    .f-box-hi { fill: color-mix(in srgb, var(--accent) 12%, var(--surface)); stroke: var(--accent); stroke-width: 1.5; }
    .f-box-liar { fill: color-mix(in srgb, var(--liar) 12%, var(--surface)); stroke: var(--liar); stroke-width: 1.5; }
    .f-t { fill: var(--ink); font-size: 16px; font-weight: 600; }
    .f-s { fill: var(--ink-2); font-size: 14.5px; }
    .f-m { fill: var(--ink-2); font-family: var(--mono) !important; font-size: 13.5px; }
    .f-panel { fill: var(--ink); font-size: 15px; font-weight: 600; }
    .f-line { stroke: var(--ink-2); stroke-width: 1.5; fill: none; }
    .f-thin { stroke: var(--muted); stroke-width: 1; fill: none; }
    .f-dash { stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 4 3; fill: none; }
    .f-head { fill: var(--ink-2); }
    .f-grid { stroke: var(--grid); stroke-width: 1; }
    .f-axis { stroke: var(--axis); stroke-width: 1; }
    .f-tick { fill: var(--muted); font-size: 13px; }
    .f-ref { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
    .f-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
    .f-label { fill: var(--ink-2); font-size: 14px; }
    .f-seg { fill: var(--caller); stroke: var(--surface); stroke-width: 2; }
    .f-seg-new { fill: color-mix(in srgb, var(--accent) 34%, var(--surface)); stroke: var(--surface); stroke-width: 2; }
    .f-tri { fill: var(--surface-2); stroke: var(--axis); stroke-width: 1.25; }
    .f-path { stroke: var(--accent); stroke-width: 2.25; fill: none; }
    .f-node { fill: var(--accent); }
    .f-honest { stroke: var(--honest); stroke-width: 2.5; fill: none; }
    .f-liar { stroke: var(--liar); stroke-width: 2.5; fill: none; }
    .f-honest-dash { stroke: var(--honest); stroke-width: 2; stroke-dasharray: 5 4; fill: none; opacity: 0.6; }
    .f-band { fill: color-mix(in srgb, var(--accent) 14%, transparent); }
    .f-bar { fill: var(--accent); }
    .f-ckpt { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.5; }
    .f-mark-lo { stroke: var(--honest); stroke-width: 2; }
    .f-mark-hi { stroke: var(--liar); stroke-width: 2; }
</style>
