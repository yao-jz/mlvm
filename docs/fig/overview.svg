<text class="f-s" x="480" y="108">two machines, different roots</text>
<rect class="f-box" x="198" y="128" width="356" height="64" rx="10"/>
<text class="f-t" x="376" y="154" text-anchor="middle">bisection over state hashes</text>
<text class="f-s" x="376" y="174" text-anchor="middle">“hash after n steps?” · ≈ log₂ N questions</text>
<line class="f-line" x1="554" y1="160" x2="576" y2="160" marker-end="url(#ah1)"/>
