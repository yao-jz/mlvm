<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 464" width="960" height="464" role="img" aria-label="From an answer to one checked instruction: someone runs a model and returns an answer that cannot be checked by itself; MLVM fingerprints every step, finds the first instruction where two runs differ in about log2 N rounds, and a referee re-executes only that instruction">

  <style>
    .bg    { fill: #ffffff; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .card  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .void  { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .title { fill: #1f2328; font: 600 19px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .sub   { fill: #59636e; font: 400 13px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .lbl   { fill: #1f2328; font: 500 13.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .hdr   { fill: #59636e; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; }
    .m     { fill: #1f2328; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .mm    { fill: #59636e; font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ms    { fill: #59636e; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .tag   { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .stage { fill: #1f2328; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .wire  { stroke: #8c959f; stroke-width: 1.3; fill: none; }
    .head  { fill: #8c959f; }
    .seg   { fill: #d0d7de; stroke: #f6f8fa; stroke-width: 1.5; }
    .segn  { fill: #3b7dd8; fill-opacity: 0.38; stroke: #f6f8fa; stroke-width: 1.5; }
    .mt    { fill: #1f2328; font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .d     { fill: #424a53; font: 400 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .c     { fill: #6e7781; font: 400 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ok    { fill: #1a7f37; font: 600 12.5px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; }
      .card  { fill: #0d1117; stroke: #30363d; }
      .void  { stroke: #6e7681; }
      .title, .lbl, .m, .stage { fill: #e6edf3; }
      .sub, .hdr, .mm, .ms { fill: #9198a1; }
      .wire  { stroke: #6e7681; }
      .head  { fill: #6e7681; }
      .seg   { fill: #30363d; stroke: #161b22; }
      .segn  { fill-opacity: 0.55; stroke: #161b22; }
      .mt    { fill: #e6edf3; }
      .d     { fill: #b7bdc8; }
      .c     { fill: #7d8590; }
      .ok    { fill: #3fb950; }
    }
  </style>

<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="bg" width="960" height="464"/>
<text class="title" x="24" y="34">From an answer to one checked instruction</text>
<text class="sub" x="24" y="56">How MLVM lets you verify a model run without running it again.</text>
<rect class="panel" x="24" y="72" width="912" height="104" rx="8"/>
<text class="hdr" x="38" y="94">THE PROBLEM</text>
<rect class="card" x="38" y="106" width="190" height="54" rx="6"/>
<text class="mt" x="52" y="127">You agree on a model</text>
<text class="d" x="52" y="146">its weights and a prompt</text>
<rect class="card" x="254" y="106" width="190" height="54" rx="6"/>
<text class="mt" x="268" y="127">Someone else runs it</text>
<text class="d" x="268" y="146">on their own computer</text>
<line class="wire" x1="230" y1="133" x2="251" y2="133" marker-end="url(#ah)"/>
<rect class="card" x="470" y="106" width="190" height="54" rx="6"/>
<text class="mt" x="484" y="127">They return an answer</text>
<text class="d" x="484" y="146">“Once upon a time, …”</text>
<line class="wire" x1="446" y1="133" x2="467" y2="133" marker-end="url(#ah)"/>
<text class="mt" x="686" y="124">Is the answer right?</text>
<text class="d" x="686" y="143">The answer alone cannot show it,</text>
<text class="d" x="686" y="160">and running the model again is expensive.</text>
<line class="wire" x1="480" y1="176" x2="480" y2="206" marker-end="url(#ah)"/>
<text class="c" x="492" y="197">MLVM makes the run checkable in three steps</text>
<rect class="panel" x="24" y="210" width="294.667" height="240" rx="8"/>
<text class="hdr" x="38" y="234">STEP 1</text>
<text class="mt" x="38" y="255">Fingerprint every step</text>
<text class="d" x="38" y="382">After any instruction, the machine's</text>
<text class="d" x="38" y="399">memory and registers hash to one</text>
<text class="d" x="38" y="416">32-byte fingerprint. The same run gives</text>
<text class="d" x="38" y="433">the same fingerprints on any computer.</text>
<rect class="panel" x="332.667" y="210" width="294.667" height="240" rx="8"/>
<text class="hdr" x="346.667" y="234">STEP 2</text>
<text class="mt" x="346.667" y="255">Find the first disagreement</text>
<text class="d" x="346.667" y="382">If two runs end with different</text>
<text class="d" x="346.667" y="399">fingerprints, compare them halfway and</text>
<text class="d" x="346.667" y="416">keep the half where they differ. About</text>
<text class="d" x="346.667" y="433">log₂ N rounds: 34 for 14.8 billion.</text>
<line class="wire" x1="319.667" y1="314" x2="330.667" y2="314" marker-end="url(#ah)"/>
<rect class="panel" x="641.333" y="210" width="294.667" height="240" rx="8"/>
<text class="hdr" x="655.333" y="234">STEP 3</text>
<text class="mt" x="655.333" y="255">Check that one instruction</text>
<text class="d" x="655.333" y="382">A referee re-executes only that</text>
<text class="d" x="655.333" y="399">instruction. It never runs the model,</text>
<text class="d" x="655.333" y="416">and the evidence is a few kilobytes</text>
<text class="d" x="655.333" y="433">that anyone can check again.</text>
<line class="wire" x1="628.333" y1="314" x2="639.333" y2="314" marker-end="url(#ah)"/>
<line x1="60" y1="298" x2="284" y2="298" stroke="#3b7dd8" stroke-width="2"/>
<text class="c" x="60" y="286" text-anchor="middle">1</text>
<circle class="card" cx="60" cy="298" r="4"/>
<rect class="card" x="35" y="310" width="50" height="20" rx="4"/>
<text class="c" x="60" y="324" text-anchor="middle">0x3a…</text>
<text class="c" x="116" y="286" text-anchor="middle">2</text>
<circle class="card" cx="116" cy="298" r="4"/>
<rect class="card" x="91" y="310" width="50" height="20" rx="4"/>
<text class="c" x="116" y="324" text-anchor="middle">0x91…</text>
<text class="c" x="172" y="286" text-anchor="middle">3</text>
<circle class="card" cx="172" cy="298" r="4"/>
<rect class="card" x="147" y="310" width="50" height="20" rx="4"/>
<text class="c" x="172" y="324" text-anchor="middle">0x07…</text>
<text class="c" x="228" y="286" text-anchor="middle">…</text>
<text class="c" x="284" y="286" text-anchor="middle">N</text>
<circle class="card" cx="284" cy="298" r="4"/>
<rect class="card" x="259" y="310" width="50" height="20" rx="4"/>
<text class="c" x="284" y="324" text-anchor="middle">0xbe…</text>
<text class="c" x="38" y="350">a fingerprint after every instruction</text>
<text class="c" x="346.667" y="276" fill="#3b7dd8">original</text>
<line x1="404.667" y1="280" x2="568.667" y2="280" stroke="#3b7dd8" stroke-width="2"/>
<text class="c" x="346.667" y="300" fill="#c9743a">changed</text>
<line x1="404.667" y1="304" x2="490.667" y2="304" stroke="#7d8590" stroke-width="2"/>
<line x1="490.667" y1="304" x2="568.667" y2="304" stroke="#c9743a" stroke-width="2"/>
<path d="M486.6666666666667,300 l8,8 m0,-8 l-8,8" stroke="#c9743a" stroke-width="2"/>
<text class="c" x="576.667" y="284" fill="#3b7dd8">0xbe…</text>
<text class="c" x="576.667" y="308" fill="#c9743a">0x89…</text>
<rect x="404.7" y="320" width="164.0" height="5" rx="2" fill="#3b7dd8" fill-opacity="0.25"/>
<rect x="486.7" y="329" width="82.0" height="5" rx="2" fill="#3b7dd8" fill-opacity="0.40"/>
<rect x="486.7" y="338" width="41.0" height="5" rx="2" fill="#3b7dd8" fill-opacity="0.55"/>
<rect x="486.7" y="347" width="20.5" height="5" rx="2" fill="#3b7dd8" fill-opacity="0.70"/>
<text class="c" x="346.667" y="326">round 1</text>
<text class="c" x="346.667" y="353">round 4</text>
<rect class="card" x="655.333" y="268" width="128" height="24" rx="4"/>
<text class="c" x="719.333" y="284" text-anchor="middle">674-byte state</text>
<rect class="card" x="791.333" y="268" width="128" height="24" rx="4"/>
<text class="c" x="855.333" y="284" text-anchor="middle">memory proof</text>
<line class="wire" x1="788.333" y1="292" x2="788.333" y2="308" marker-end="url(#ah)"/>
<rect class="card" x="655.333" y="310" width="266" height="28" rx="4"/>
<rect x="655.3333333333334" y="318" width="3" height="12" rx="1.5" fill="#8b6cc9"/>
<text class="c" x="669.333" y="328">re-execute</text>
<text class="m" x="749.333" y="329">fmul.s ft3, ft4, ft5</text>
<text class="ok" x="655.333" y="358">✓ the original run is right</text>
</svg>